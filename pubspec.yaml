name: smart_knowledge_library
description: "المكتبة المعرفية الذكية - تطبيق تسجيل صوتي محلي وتفريغ نصي عربي ذكي مع تزامن سحابي موثوق."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة وحقن الاعتماديات
  flutter_riverpod: ^2.5.1

  # قاعدة البيانات المحلية والتشفير (SQLite + FTS5 + SQLCipher)
  sqflite_sqlcipher: ^3.1.0+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # التسجيل الصوتي والتشغيل (WAV / Opus)
  record: ^5.1.2
  just_audio: ^0.9.38

  # التشفير والأمان المحلي (AES-256-GCM + Keystore/Keychain)
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # الشبكة والرفع القابل للاستئناف (TUS Protocol) ومهام الخلفية
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  workmanager: ^0.5.2

  # أدوات مساعدة
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
